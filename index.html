<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapZap.az - Ehtiyat Hissəsi Axtarışı</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #334155;
            padding: 20px 15px;
        }

        .header {
            max-width: 650px;
            margin: 0 auto 20px auto;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .slogan {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 24px;
            border: 1px solid var(--border);
        }

        .form-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Qiymət Təklifləri Paneli */
        .live-offers {
            margin-top: 30px;
            display: none;
        }

        .live-offers.active {
            display: block;
        }

        .status-bar {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .status-text {
            font-size: 13px;
            color: #0369a1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .offer-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            animation: slideDown 0.4s ease-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .store-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--primary);
        }

        .rating {
            font-size: 12px;
            color: #d97706;
            background: #fef3c7;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .offer-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 6px;
        }

        .tag-original { background: #dcfce7; color: #15803d; }
        .tag-aftermarket { background: #f1f5f9; color: #475569; }

        .price {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .delivery-info {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .btn-contact {
            background: var(--success);
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">TapZap<span>.az</span></div>
    <div class="slogan">Zəng etmə, vaxt itirmə! VIN kodu yaz, Bakı mağazaları qiymət yazsın.</div>
</div>

<div class="container">
    <div class="form-title">🚗 Ehtiyat Hissəsi Sorğusu Yarat</div>
    
    <form id="searchForm" onsubmit="submitRequest(event)">
        <div class="form-group">
            <label for="carModel">Avtomobil Modeli və İli:</label>
            <input type="text" id="carModel" placeholder="Məsələn: 2018 Ford Escape 1.5 L" required>
        </div>

        <div class="form-group">
            <label for="vinCode">VIN Kod (Şassi nömrəsi):</label>
            <input type="text" id="vinCode" placeholder="17 rəqəmli VIN kodu daxil edin" maxlength="17" required style="text-transform: uppercase;">
        </div>

        <div class="form-group">
            <label for="partName">Axtarılan Ehtiyat Hissəsi:</label>
            <input type="text" id="partName" placeholder="Məsələn: Alışdırma Şamları (Denso Iridium)" required>
        </div>

        <div class="form-group">
            <label for="partCondition">Üstünlük verilən durum:</label>
            <select id="partCondition">
                <option value="all">Fərq etməz (Ən sərfəli təklif)</option>
                <option value="original">Yalnız Orijinal</option>
                <option value="aftermarket">Firma / AFT (Analoq)</option>
                <option value="used">İşlənmiş (Ölüxana)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Sorğunu Bakı Mağazalarına Göndər</button>
    </form>

    <!-- CANLI CANLI GƏLƏN TƏKLİFLƏR PANELSİ -->
    <div class="live-offers" id="liveOffers">
        <div class="status-bar">
            <div class="status-text">
                <div class="pulse-dot"></div>
                <span id="statusMessage">Sorğu göndərildi. Mağazalardan cavab gözlənilir...</span>
            </div>
            <strong id="offerCount" style="font-size: 13px;">0 Təklif</strong>
        </div>

        <div id="offersContainer">
            <!-- Dynamic Offers Will Appear Here -->
        </div>
    </div>
</div>

<script>
    let offerCounter = 0;

    function submitRequest(event) {
        event.preventDefault();

        const carModel = document.getElementById('carModel').value;
        const partName = document.getElementById('partName').value;

        // Düyməni deaktiv edirik
        document.getElementById('btnSubmit').disabled = true;
        document.getElementById('btnSubmit').innerText = 'Sorğu Aktivdir...';
        document.getElementById('btnSubmit').style.opacity = '0.6';

        // Təkliflər panelini göstəririk
        const liveOffers = document.getElementById('liveOffers');
        liveOffers.classList.add('active');
        document.getElementById('offersContainer').innerHTML = '';
        offerCounter = 0;

        // Mağaza cavablarını simulyasiya edirik (Real sistemdə WebSockets/Supabase Realtime olacaq)
        setTimeout(() => addSimulatedOffer("Məmmədov Auto Parts", 4.9, 32, "Orijinal (Denso)", "20 dəqiqəyə usta boksa çatdırılma", "tag-original"), 3000);
        setTimeout(() => addSimulatedOffer("Baku Auto Store", 4.7, 24, "AFT (NGK Analoq)", "Gəlib götürmək və ya Kuryer", "tag-aftermarket"), 6000);
        setTimeout(() => addSimulatedOffer("Ford Ehtiyat Hissələri (Babək pr.)", 4.8, 28, "Orijinal (Motorcraft)", "30 dəqiqəyə çatdırılma", "tag-original"), 10000);
    }

    function addSimulatedOffer(storeName, rating, price, brand, delivery, tagClass) {
        offerCounter++;
        document.getElementById('offerCount').innerText = `${offerCounter} Təklif`;
        document.getElementById('statusMessage').innerText = `Canlı təkliflər daxil olur...`;

        const offersContainer = document.getElementById('offersContainer');
        const card = document.createElement('div');
        card.className = 'offer-card';

        card.innerHTML = `
            <div class="store-header">
                <span class="store-name">🏬 ${storeName}</span>
                <span class="rating">★ ${rating}</span>
            </div>
            <div>
                <span class="tag ${tagClass}">${brand}</span>
            </div>
            <div class="delivery-info">🚚 ${delivery}</div>
            <div class="offer-details">
                <div>
                    <span style="font-size:11px; color:#64748b;">Qiymət:</span>
                    <div class="price">${price} AZN</div>
                </div>
                <a href="https://wa.me/994500000000" target="_blank" class="btn-contact">Sifariş Et (WhatsApp)</a>
            </div>
        `;

        offersContainer.prepend(card);
    }
</script>

</body>
</html>
