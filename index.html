<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapZap.az - Ehtiyat Hissəsi Sorğusu</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #334155;
            padding: 20px 12px;
        }

        .header {
            max-width: 600px;
            margin: 0 auto 20px auto;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        .logo span { color: var(--accent); }

        .slogan {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            padding: 20px;
            border: 1px solid var(--border);
        }

        .form-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #475569;
            text-transform: uppercase;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .photo-upload-box {
            background: #f1f5f9;
            border: 1px dashed #94a3b8;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">TapZap<span>.az</span></div>
    <div class="slogan">Zəng etmə, vaxt itirmə! 1 tıkla Bakı mağazaları qiymət yazsın.</div>
</div>

<div class="container">
    <div class="form-title">🚗 AVTOMOBİL VƏ DETAL MƏLUMATLARI</div>
    
    <form id="partRequestForm" onsubmit="handleFormSubmit(event)">
        
        <!-- Marka və Model -->
        <div class="grid-2">
            <div class="form-group">
                <label for="brand">Marka *</label>
                <select id="brand" onchange="updateModels()" required>
                    <option value="">Seçin...</option>
                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                    <option value="Ford">Ford</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Kia">Kia</option>
                    <option value="Toyota">Toyota</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model *</label>
                <select id="model" onchange="updateYears()" required disabled>
                    <option value="">Əvvəlcə markanı seçin</option>
                </select>
            </div>
        </div>

        <!-- İl və Mühərrik -->
        <div class="grid-2">
            <div class="form-group">
                <label for="year">İl *</label>
                <select id="year" onchange="updateEngines()" required disabled>
                    <option value="">Əvvəlcə modeli seçin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="engine">Mühərrik Həcmi *</label>
                <select id="engine" required disabled>
                    <option value="">Əvvəlcə ili seçin</option>
                </select>
            </div>
        </div>

        <!-- VIN Kod -->
        <div class="form-group">
            <label for="vin">VIN Kod (17 Simvol - Texpasportdan)</label>
            <input type="text" id="vin" placeholder="Məs: 1FA6P8CF0J..." maxlength="17" style="text-transform: uppercase;">
        </div>

        <!-- Detal Seçimi -->
        <div class="form-group">
            <label for="partCategory">Ehtiyat Hissəsi *</label>
            <select id="partCategory" onchange="toggleCustomPartInput()" required>
                <option value="">Axtarılan detalı seçin...</option>
                <option value="Alışdırma şamları (Sveça)">Alışdırma şamları (Sveça)</option>
                <option value="Əyləc bəndləri (Apornular/Nakladka)">Əyləc bəndləri (Nakladka)</option>
                <option value="EVAP Purge Klapanı">EVAP Purge Klapanı</option>
                <option value="Yağ / Hava / Salun Filtri">Yağ / Hava / Salun Filtri</option>
                <option value="Akkumulyator">Akkumulyator</option>
                <option value="Amortizatorlar">Amortizatorlar</option>
                <option value="Qabaq / Arxa Bufer">Qabaq / Arxa Bufer</option>
                <option value="custom">-- Siyahıda Yoxdur (Əllə Yaz) --</option>
            </select>
        </div>

        <!-- Digər Detal (Gizli Xana) -->
        <div class="form-group" id="customPartGroup" style="display: none;">
            <label for="customPart">Detalın Adını Dəqiq Yazın *</label>
            <input type="text" id="customPart" placeholder="Məsələn: Sağ ön duman əleyhinə fənər çərçivəsi">
        </div>

        <!-- Detalın Durumu -->
        <div class="form-group">
            <label for="condition">Üstünlük verilən durum</label>
            <select id="condition">
                <option value="ALL">Fərq etməz (Ən sərfəli təklif)</option>
                <option value="OEM">Yalnız Orijinal</option>
                <option value="AFT">Firma / Analoq (AFT)</option>
                <option value="USED">İşlənmiş (Ölüxana)</option>
            </select>
        </div>

        <!-- Şəkil Yükləmə (Maksimum 2 Ədəd) -->
        <div class="form-group">
            <label>Şəkil Əlavə Et (Maksimum 2 ədəd - Detal və ya Texpasport)</label>
            <div class="photo-upload-box grid-2">
                <div>
                    <span style="font-size:11px; color:#64748b;">Şəkil 1:</span>
                    <input type="file" id="photo1" accept="image/*">
                </div>
                <div>
                    <span style="font-size:11px; color:#64748b;">Şəkil 2:</span>
                    <input type="file" id="photo2" accept="image/*">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">Sorğunu Göndər</button>
    </form>
</div>

<script>
    // Marka, Model, İl və Mühərrik Baza Məlumatları
    const autoData = {
        "Mercedes-Benz": {
            "C-Class (C300, C250)": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.8 L", "2.0 L Turbo", "3.5 L V6"] },
            "E-Class (E200, E300, E350)": { years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018], engines: ["2.0 L Turbo", "3.0 L", "3.5 L V6"] }
        },
        "Ford": {
            "Escape": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.5 L EcoBoost", "1.6 L EcoBoost", "2.0 L EcoBoost", "2.5 L Atmosfer"] },
            "Fusion": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.5 L EcoBoost", "2.0 L EcoBoost", "2.5 L Atmosfer", "2.0 L Hybrid"] }
        },
        "Hyundai": {
            "Elantra": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.6 L", "1.8 L", "2.0 L"] },
            "Santa Fe": { years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["2.0 L Turbo", "2.2 L Diesel", "2.4 L"] }
        },
        "Kia": {
            "Optima": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.6 L Turbo", "2.0 L", "2.4 L"] }
        },
        "Toyota": {
            "Camry": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["2.5 L Atmosfer", "2.5 L Hybrid", "3.5 L V6"] },
            "Corolla": { years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019], engines: ["1.4 L Diesel", "1.6 L", "1.8 L"] }
        }
    };

    function updateModels() {
        const brand = document.getElementById('brand').value;
        const modelSelect = document.getElementById('model');
        const yearSelect = document.getElementById('year');
        const engineSelect = document.getElementById('engine');

        modelSelect.innerHTML = '<option value="">Model seçin...</option>';
        yearSelect.innerHTML = '<option value="">Əvvəlcə modeli seçin</option>';
        engineSelect.innerHTML = '<option value="">Əvvəlcə ili seçin</option>';
        
        yearSelect.disabled = true;
        engineSelect.disabled = true;

        if (brand && autoData[brand]) {
            modelSelect.disabled = false;
            Object.keys(autoData[brand]).forEach(model => {
                modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
            });
        } else {
            modelSelect.disabled = true;
        }
    }

    function updateYears() {
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const yearSelect = document.getElementById('year');
        const engineSelect = document.getElementById('engine');

        yearSelect.innerHTML = '<option value="">İl seçin...</option>';
        engineSelect.innerHTML = '<option value="">Əvvəlcə ili seçin</option>';
        engineSelect.disabled = true;

        if (brand && model && autoData[brand][model]) {
            yearSelect.disabled = false;
            autoData[brand][model].years.reverse().forEach(year => {
                yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
            });
        } else {
            yearSelect.disabled = true;
        }
    }

    function updateEngines() {
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const engineSelect = document.getElementById('engine');

        engineSelect.innerHTML = '<option value="">Mühərrik həcmi seçin...</option>';

        if (brand && model && autoData[brand][model]) {
            engineSelect.disabled = false;
            autoData[brand][model].engines.forEach(engine => {
                engineSelect.innerHTML += `<option value="${engine}">${engine}</option>`;
            });
        } else {
            engineSelect.disabled = true;
        }
    }

    function toggleCustomPartInput() {
        const partCategory = document.getElementById('partCategory').value;
        const customPartGroup = document.getElementById('customPartGroup');
        const customPartInput = document.getElementById('customPart');

        if (partCategory === 'custom') {
            customPartGroup.style.display = 'block';
            customPartInput.required = true;
        } else {
            customPartGroup.style.display = 'none';
            customPartInput.required = false;
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        alert('Sorğunuz uğurla yaradıldı! Telegram üzərindən uyğun mağazalara göndərilir...');
    }
</script>

</body>
</html>
