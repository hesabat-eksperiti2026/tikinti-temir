<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvtoOnline.az - Sorğu Formu</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #f59e0b;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: #334155; padding: 20px 12px; }

        .header { max-width: 600px; margin: 0 auto 20px auto; text-align: center; }
        .logo { font-size: 30px; font-weight: 900; color: var(--primary); }
        .logo span { color: var(--accent); }
        .slogan { font-size: 13px; color: #64748b; margin-top: 4px; }

        .container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            border-radius: 16px; padding: 20px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .form-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--primary); border-bottom: 2px solid var(--bg); padding-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
        
        input[type="text"], select, input[type="file"] {
            width: 100%; padding: 11px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; background-color: #fff; outline: none;
        }

        .photo-box { background: #f1f5f9; border: 1px dashed #94a3b8; padding: 12px; border-radius: 8px; margin-top: 5px; }
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* CANLI TƏKLİFLƏR PANELSİ (EKRANDA GÖRÜNƏN CAVABLAR) */
        .live-offers { margin-top: 30px; display: none; }
        .live-offers.active { display: block; }
        .status-bar {
            background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px 16px;
            border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;
        }
        .status-text { font-size: 13px; color: #0369a1; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .pulse-dot {
            width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .offer-card {
            background: #ffffff; border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 12px; animation: slideDown 0.4s ease-out; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .store-name { font-weight: 700; font-size: 15px; color: var(--primary); }
        .rating { font-size: 12px; color: #d97706; background: #fef3c7; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .offer-details { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; margin-right: 6px; }
        .tag-original { background: #dcfce7; color: #15803d; }
        .tag-aftermarket { background: #f1f5f9; color: #475569; }
        .price { font-size: 20px; font-weight: 800; color: var(--primary); }
        .delivery-info { font-size: 12px; color: #64748b; margin-top: 4px; }
        .btn-contact { background: var(--success); color: white; border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }

        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">AVTO<span>ONLINE.AZ</span></div>
    <div class="slogan">Canlı Ehtiyat Hissəsi Sorğu Platforması</div>
</div>

<div class="container">
    <div class="form-title">🚗 SORĞU FORMU</div>
    
    <form id="tgRequestForm" onsubmit="sendToTelegram(event)">
        <!-- Marka və Model -->
        <div class="grid-2">
            <div class="form-group">
                <label for="brand">Marka *</label>
                <select id="brand" onchange="updateModels()" required>
                    <option value="">Seçin...</option>
                    <option value="Mercedes-Benz">Mercedes-Benz</option>
                    <option value="Ford">Ford</option>
                    <option value="Hyundai">Hyundai</option>
                    <option value="Kia">Kia</option>
                    <option value="Toyota">Toyota</option>
                </select>
            </div>
            <div class="form-group">
                <label for="model">Model *</label>
                <select id="model" onchange="updateYears()" required disabled>
                    <option value="">Əvvəlcə markanı seçin</option>
                </select>
            </div>
        </div>

        <!-- İl və Mühərrik -->
        <div class="grid-2">
            <div class="form-group">
                <label for="year">İl *</label>
                <select id="year" onchange="updateEngines()" required disabled>
                    <option value="">Əvvəlcə modeli seçin</option>
                </select>
            </div>
            <div class="form-group">
                <label for="engine">Mühərrik *</label>
                <select id="engine" required disabled>
                    <option value="">Əvvəlcə ili seçin</option>
                </select>
            </div>
        </div>

        <!-- VIN Kod -->
        <div class="form-group">
            <label for="vin">VIN Kod (Texpasportdan 17 simvol)</label>
            <input type="text" id="vin" placeholder="Məs: 1FA6P8CF0J..." maxlength="17" style="text-transform: uppercase;">
        </div>

        <!-- ŞƏKİL ƏLAVƏ ET (VIN KODUN BİRBAŞA ALTINDA) -->
        <div class="form-group">
            <label>Texpasport və ya Detal Şəkli (Maks 2 Ədəd)</label>
            <div class="photo-box grid-2">
                <div>
                    <span style="font-size:11px; color:#64748b;">Şəkil 1 (Texpasport):</span>
                    <input type="file" id="photo1" accept="image/*">
                </div>
                <div>
                    <span style="font-size:11px; color:#64748b;">Şəkil 2 (Detal):</span>
                    <input type="file" id="photo2" accept="image/*">
                </div>
            </div>
        </div>

        <!-- Ehtiyat Hissəsi -->
        <div class="form-group">
            <label for="partCategory">Ehtiyat Hissəsi *</label>
            <select id="partCategory" onchange="toggleCustomPartInput()" required>
                <option value="">Axtarılan detalı seçin...</option>
                <option value="Alışdırma şamları (Sveça)">Alışdırma şamları (Sveça)</option>
                <option value="Əyləc bəndləri (Nakladka)">Əyləc bəndləri (Nakladka)</option>
                <option value="EVAP Purge Klapanı">EVAP Purge Klapanı</option>
                <option value="Yağ / Hava / Salun Filtri">Yağ / Hava / Salun Filtri</option>
                <option value="Akkumulyator">Akkumulyator</option>
                <option value="Amortizatorlar">Amortizatorlar</option>
                <option value="Qabaq / Arxa Bufer">Qabaq / Arxa Bufer</option>
                <option value="custom">-- Siyahıda Yoxdur (Əllə Yaz) --</option>
            </select>
        </div>

        <div class="form-group" id="customPartGroup" style="display: none;">
            <label for="customPart">Detalın Adını Dəqiq Yazın *</label>
            <input type="text" id="customPart" placeholder="Məs: Sağ ön duman işığı çərçivəsi">
        </div>

        <div class="form-group">
            <label for="condition">Üstünlük verilən durum</label>
            <select id="condition">
                <option value="Fərq etməz">Fərq etməz (Ən sərfəli təklif)</option>
                <option value="Yalnız Orijinal">Yalnız Orijinal</option>
                <option value="Firma / Analoq (AFT)">Firma / Analoq (AFT)</option>
                <option value="İşlənmiş (Ölüxana)">İşlənmiş (Ölüxana)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Sorğunu Göndər</button>
    </form>

    <!-- MÜŞTƏRİ ÜÇÜN CANLI MAĞAZA TƏKLİFLƏRİ PANELSİ -->
    <div class="live-offers" id="liveOffers">
        <div class="status-bar">
            <div class="status-text">
                <div class="pulse-dot"></div>
                <span id="statusMessage">Sorğu aktivdir. Mağazalardan canlı qiymət cavabları gözlənilir...</span>
            </div>
            <strong id="offerCount" style="font-size: 13px;">0 Təklif</strong>
        </div>

        <div id="offersContainer">
            <!-- Dynamic Simulated Offers Will Appear Here -->
        </div>
    </div>
</div>

<script>
    // BOT INTEGRATION (TƏNZİMLƏNİB)
    const BOT_TOKEN = "8638131153:AAFqTlHKfVwx92Y63ZYK6sMNftsFlbmQjwc";
    const CHAT_ID = "8889694970";

    const autoData = {
        "Mercedes-Benz": {
            "C-Class (C300, C250)": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.8 L", "2.0 L Turbo", "3.5 L V6"] },
            "E-Class (E200, E300, E350)": { years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018], engines: ["2.0 L Turbo", "3.0 L", "3.5 L V6"] }
        },
        "Ford": {
            "Escape": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.5 L EcoBoost", "1.6 L EcoBoost", "2.0 L EcoBoost", "2.5 L Atmosfer"] },
            "Fusion": { years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.5 L EcoBoost", "2.0 L EcoBoost", "2.5 L Atmosfer", "2.0 L Hybrid"] }
        },
        "Hyundai": {
            "Elantra": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.6 L", "1.8 L", "2.0 L"] }
        },
        "Kia": {
            "Optima": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["1.6 L Turbo", "2.0 L", "2.4 L"] }
        },
        "Toyota": {
            "Camry": { years: [2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020], engines: ["2.5 L Atmosfer", "2.5 L Hybrid", "3.5 L V6"] }
        }
    };

    function updateModels() {
        const brand = document.getElementById('brand').value;
        const modelSelect = document.getElementById('model');
        modelSelect.innerHTML = '<option value="">Model seçin...</option>';
        if (brand && autoData[brand]) {
            modelSelect.disabled = false;
            Object.keys(autoData[brand]).forEach(m => modelSelect.innerHTML += `<option value="${m}">${m}</option>`);
        } else { modelSelect.disabled = true; }
    }

    function updateYears() {
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const yearSelect = document.getElementById('year');
        yearSelect.innerHTML = '<option value="">İl seçin...</option>';
        if (brand && model && autoData[brand][model]) {
            yearSelect.disabled = false;
            autoData[brand][model].years.reverse().forEach(y => yearSelect.innerHTML += `<option value="${y}">${y}</option>`);
        } else { yearSelect.disabled = true; }
    }

    function updateEngines() {
        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const engineSelect = document.getElementById('engine');
        engineSelect.innerHTML = '<option value="">Mühərrik seçin...</option>';
        if (brand && model && autoData[brand][model]) {
            engineSelect.disabled = false;
            autoData[brand][model].engines.forEach(e => engineSelect.innerHTML += `<option value="${e}">${e}</option>`);
        } else { engineSelect.disabled = true; }
    }

    function toggleCustomPartInput() {
        const partCategory = document.getElementById('partCategory').value;
        const customPartGroup = document.getElementById('customPartGroup');
        customPartGroup.style.display = (partCategory === 'custom') ? 'block' : 'none';
    }

    let offerCounter = 0;

    async function sendToTelegram(event) {
        event.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Telegram-a Göndərilir...";

        const brand = document.getElementById('brand').value;
        const model = document.getElementById('model').value;
        const year = document.getElementById('year').value;
        const engine = document.getElementById('engine').value;
        const vin = document.getElementById('vin').value || "Qeyd edilməyib";
        
        let part = document.getElementById('partCategory').value;
        if(part === 'custom') part = document.getElementById('customPart').value;
        
        const condition = document.getElementById('condition').value;

        // Telegram Mesajı
        const textMessage = `🔔 *YENİ EHTİYAT HİSSƏSİ SORĞUSU*\n\n` +
            `🚗 *Avtomobil:* ${brand} ${model} (${year})\n` +
            `⚙️ *Mühərrik:* ${engine}\n` +
            `🔢 *VIN Kod:* \`${vin}\`\n\n` +
            `🛠 *Axtarılan Detal:* ${part}\n` +
            `🏷 *Durum:* ${condition}\n` +
            `⏰ *Tarix:* ${new Date().toLocaleString('az-AZ')}`;

        try {
            // Text Telegram-a gedir
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage, parse_mode: 'Markdown' })
            });

            // Şəkillər göndərilir
            const photo1 = document.getElementById('photo1').files[0];
            const photo2 = document.getElementById('photo2').files[0];

            if (photo1) await sendPhotoToTg(photo1);
            if (photo2) await sendPhotoToTg(photo2);

            // Telegram göndərildikdən sonra canlı panel işə düşür
            startLiveOffersSimulation();

        } catch (error) {
            alert("❌ Xəta baş verdi. Telegram bota /start verdiyinizdən əmin olun.");
            btn.disabled = false;
            btn.innerText = "Sorğunu Göndər";
        }
    }

    async function sendPhotoToTg(file) {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', file);

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        });
    }

    function startLiveOffersSimulation() {
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Sorğu Aktivdir...";
        
        const liveOffers = document.getElementById('liveOffers');
        liveOffers.classList.add('active');
        document.getElementById('offersContainer').innerHTML = '';
        offerCounter = 0;

        // Mağaza cavablarının canlı simulyasiyası
        setTimeout(() => addSimulatedOffer("Məmmədov Auto Parts", 4.9, 35, "Orijinal (Denso)", "20 dəqiqəyə usta boksa çatdırılma", "tag-original"), 2500);
        setTimeout(() => addSimulatedOffer("Baku Auto Store (Babək pr.)", 4.7, 25, "AFT (NGK Analoq)", "Gəlib götürmək və ya Kuryer", "tag-aftermarket"), 5500);
        setTimeout(() => addSimulatedOffer("Ford Ehtiyat Hissələri (Sumqayıt yolu)", 4.8, 28, "Orijinal (Motorcraft)", "30 dəqiqəyə çatdırılma", "tag-original"), 9000);
    }

    function addSimulatedOffer(storeName, rating, price, brand, delivery, tagClass) {
        offerCounter++;
        document.getElementById('offerCount').innerText = `${offerCounter} Təklif`;

        const offersContainer = document.getElementById('offersContainer');
        const card = document.createElement('div');
        card.className = 'offer-card';

        card.innerHTML = `
            <div class="store-header">
                <span class="store-name">🏬 ${storeName}</span>
                <span class="rating">★ ${rating}</span>
            </div>
            <div>
                <span class="tag ${tagClass}">${brand}</span>
            </div>
            <div class="delivery-info">🚚 ${delivery}</div>
            <div class="offer-details">
                <div>
                    <span style="font-size:11px; color:#64748b;">Qiymət:</span>
                    <div class="price">${price} AZN</div>
                </div>
                <a href="https://wa.me/994702887282" target="_blank" class="btn-contact">Sifariş Et (WhatsApp)</a>
            </div>
        `;

        offersContainer.prepend(card);
    }
</script>

</body>
</html>
