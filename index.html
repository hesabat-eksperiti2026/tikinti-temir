<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVTOONLINE.AZ - Canlı Sorğu və Təklif Platforması</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #f59e0b;
            --blue: #0284c7;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: #334155; padding: 20px 12px; }

        .header { max-width: 600px; margin: 0 auto 20px auto; text-align: center; }
        .logo { font-size: 32px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .slogan { font-size: 12px; color: #64748b; font-weight: 700; letter-spacing: 2px; margin-top: 2px; }

        .container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            border-radius: 16px; padding: 20px; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }

        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border); background: #f1f5f9;
            border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: #64748b;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .form-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--primary); border-bottom: 2px solid var(--bg); padding-bottom: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
        
        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%; padding: 11px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; background-color: #fff; outline: none;
        }

        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* TƏKLİFLƏR PANELSİ */
        .offer-card {
            background: #ffffff; border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-top: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .store-name { font-weight: 700; font-size: 15px; color: var(--primary); }
        .price { font-size: 22px; font-weight: 800; color: var(--blue); }
        .btn-select { background: var(--success); color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }

        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">AVTO<span>ONLINE.AZ</span></div>
    <div class="slogan">CANLI EHTİYAT HİSSƏSİ SORĞU PLATFORMASI</div>
</div>

<div class="container">
    <!-- EKRAN KEÇİDLƏRİ (SINAQ ÜÇÜN) -->
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('client')">👤 Müştəri Paneli</button>
        <button class="tab-btn" onclick="switchTab('merchant')">🏬 Mağaza Paneli (Linklə)</button>
    </div>

    <!-- 1. MÜŞTƏRİ SORĞU PANELİ -->
    <div id="clientView">
        <div class="form-title">🚗 EHTİYAT HİSSƏSİ AXTARİŞİ</div>
        <form onsubmit="handleClientSubmit(event)">
            <div class="grid-2">
                <div class="form-group">
                    <label>Marka *</label>
                    <select id="brand" required>
                        <option value="Mercedes-Benz">Mercedes-Benz</option>
                        <option value="Ford">Ford</option>
                        <option value="Hyundai">Hyundai</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Model və İl *</label>
                    <input type="text" id="modelYear" placeholder="Məs: C300 (2015)" required>
                </div>
            </div>

            <div class="form-group">
                <label>VIN Kod (Texpasportdan 17 Simvol)</label>
                <input type="text" id="vin" placeholder="Məs: WDD2050401R..." maxlength="17" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label>Axtarılan Detal *</label>
                <input type="text" id="partName" placeholder="Məs: EVAP Purge Klapanı" required>
            </div>

            <div class="form-group">
                <label>Əlaqə Telefonunuz *</label>
                <input type="text" id="clientPhone" placeholder="050-XXX-XX-XX" required>
            </div>

            <button type="submit" class="btn-submit" id="btnClientSubmit">Sorğunu Mağazalara Göndər</button>
        </form>

        <!-- CANLI TƏKLİFLƏR -->
        <div id="liveOffersSection" style="display:none; margin-top:25px;">
            <div class="form-title" style="color:var(--blue);">📩 DAXİL OLAN TƏKLİFLƏR</div>
            <div id="offersList">
                <!-- Mağazalardan gələn qiymətlər bura düşəcək -->
            </div>
        </div>
    </div>

    <!-- 2. MAĞAZA PANELİ (TELEGRAM LİNKİNƏ KLİKLƏYƏNDƏ AÇILAN SƏHİFƏ) -->
    <div id="merchantView" style="display: none;">
        <div class="form-title" style="color:var(--accent);">🏬 MAĞAZA TƏKLİF FORMU (#SORĞU-104)</div>
        
        <div style="background:#f1f5f9; padding:12px; border-radius:8px; margin-bottom:15px; font-size:13px;">
            <strong>Müştərinin Sorğusu:</strong><br>
            🚗 Ford Escape (2018) 1.5L<br>
            🛠 Alışdırma Şamları (Denso Iridium)<br>
            🔢 VIN: 1FA6P8CF0J...
        </div>

        <form onsubmit="handleMerchantSubmit(event)">
            <div class="form-group">
                <label>Mağazanızın Adı *</label>
                <input type="text" id="storeName" placeholder="Məs: Avtobest (Maarif)" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Təklif Etdiyiniz Qiymət (AZN) *</label>
                    <input type="number" id="offerPrice" placeholder="Məs: 35" required>
                </div>
                <div class="form-group">
                    <label>Durum / Firma *</label>
                    <select id="offerBrand">
                        <option value="Orijinal (Denso)">Orijinal (Denso)</option>
                        <option value="Firma (AFT)">Firma (AFT)</option>
                        <option value="İşlənmiş (Ölüxana)">İşlənmiş (Ölüxana)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Çatdırılma Şərti</label>
                <input type="text" id="offerDelivery" placeholder="Məs: 30 dəqiqəyə usta sexinə">
            </div>

            <button type="submit" class="btn-submit" style="background:var(--blue);">Təklifi Müştəriyə Göndər</button>
        </form>
    </div>
</div>

<script>
    const BOT_TOKEN = "8638131153:AAFqTlHKfVwx92Y63ZYK6sMNftsFlbmQjwc";
    const CHAT_ID = "8889694970";

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (tab === 'client') {
            document.getElementById('clientView').style.display = 'block';
            document.getElementById('merchantView').style.display = 'none';
            event.target.classList.add('active');
        } else {
            document.getElementById('clientView').style.display = 'none';
            document.getElementById('merchantView').style.display = 'block';
            event.target.classList.add('active');
        }
    }

    // MÜŞTƏRİ SORĞU GÖNDƏRİR
    async function handleClientSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('btnClientSubmit');
        btn.disabled = true;
        btn.innerText = "Göndərilir...";

        const brand = document.getElementById('brand').value;
        const modelYear = document.getElementById('modelYear').value;
        const partName = document.getElementById('partName').value;

        // Telegram-a bildiriş gedir (Mağaza üçün keçid linki ilə)
        const tgMsg = `🔔 *YENİ SORĞU CƏLB OLUNDU (#104)*\n\n` +
                      `🚗 *Avtomobil:* ${brand} ${modelYear}\n` +
                      `🛠 *Detal:* ${partName}\n\n` +
                      `👉 *Təklif vermək üçün klikləyin:* https://avtonline.az/sorgu/104`;

        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: tgMsg, parse_mode: 'Markdown' })
            });

            alert("✅ Sorğunuz Telegram üzərindən mağazalara çatdırıldı!");
            document.getElementById('liveOffersSection').style.display = 'block';
        } catch (err) {
            alert("❌ Xəta baş verdi.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Sorğunu Göndər";
        }
    }

    // MAĞAZA TƏKLİF YAZIR (SAYTDAN)
    function handleMerchantSubmit(e) {
        e.preventDefault();
        const storeName = document.getElementById('storeName').value;
        const price = document.getElementById('offerPrice').value;
        const brand = document.getElementById('offerBrand').value;
        const delivery = document.getElementById('offerDelivery').value || "1 saat içində";

        // MÜŞTƏRİ EKRANINA TƏKLİF DÜŞÜR
        const offersList = document.getElementById('offersList');
        const card = document.createElement('div');
        card.className = 'offer-card';

        card.innerHTML = `
            <div class="store-header">
                <span class="store-name">🏬 ${storeName}</span>
                <span class="price">${price} AZN</span>
            </div>
            <div style="font-size:12px; color:#64748b; margin-bottom:8px;">
                🏷 ${brand} | 🚚 ${delivery}
            </div>
            <button class="btn-select" onclick="selectOffer('${storeName}', '${price}')">Sifarişi Təsdilə Və Seç</button>
        `;

        offersList.prepend(card);
        alert("✅ Təklifiniz saytda müştərinin canlı ekranına düşdü!");
        switchTab('client');
    }

    // MÜŞTƏRİ TƏKLİFİ SEÇİR VƏ MAĞAZANIN TELEGRAMINA SON BİLDİRİŞ GEDİR
    async function selectOffer(storeName, price) {
        const phone = document.getElementById('clientPhone').value || "050-123-45-67";
        
        const finalMsg = `🎉 *TƏBRİKLƏR! SİFARİŞİNİZ TƏSDİQLƏNDİ*\n\n` +
                         `🏬 *Seçilən Mağaza:* ${storeName}\n` +
                         `💰 *Məbləğ:* ${price} AZN\n\n` +
                         `👤 *Müştərinin Telefonu:* \`${phone}\`\n` +
                         `📞 *Dərhal zəng edin və ya WhatsApp-la əlaqə saxlayın!*`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: finalMsg, parse_mode: 'Markdown' })
        });

        alert(`✅ Sifarişiniz təsdiqləndi! ${storeName} mağazasına bildiriş və nömrəniz göndərildi.`);
    }
</script>

</body>
</html>
